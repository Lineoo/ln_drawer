name: Release
run-name: Release v${{ inputs.version }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (without "v" prefix, for example "1.2.6-beta.3")
        required: true
        type: string
      draft:
        description: Generate a Draft Release
        default: true
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.platform }} ${{ matrix.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64 Linux
            platform: desktop
            target: x86_64-unknown-linux-gnu
            package: linux-tar

          - name: x86_64 Windows
            platform: desktop
            target: x86_64-pc-windows-gnu
            package: windows-zip

          - name: Aarch64 Android
            platform: android
            target: aarch64-linux-android
            package: android-apk

    steps:
    - name: '[Actions] Checkout'
      uses: actions/checkout@v7

    - name: '[Actions] Cache'
      uses: actions/cache@v6
      with:
        key: ubuntu-build-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ubuntu-build-${{ matrix.target }}-
          ubuntu-build-
          ubuntu-
        path: |
          ~/.cargo
          target

    - name: '[Install] MinGW-w64 for Win32 & Posix'
      if: ${{ matrix.target == 'x86_64-pc-windows-gnu' }}
      run: sudo apt-get install gcc-mingw-w64-x86-64-win32 gcc-mingw-w64-x86-64-posix

    - name: '[Install] AppImage Tool'
      if: ${{ matrix.package == 'linux-tar' }}
      run: |
        curl -fsSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x "$RUNNER_TEMP/appimagetool"

    - name: '[Install] Rustup Target ${{ matrix.target }}'
      run: rustup target add ${{ matrix.target }}

    - name: '[Install] Cargo Ndk'
      if: ${{ matrix.platform == 'android' }}
      run: cargo install cargo-ndk --version 4.1.2

    - name: '[Setup] Version Configuration'
      env:
        VERSION: ${{ inputs.version }}
      run: scripts/version.sh "$VERSION"

    - name: '[Setup] Release Configuration'
      run: scripts/release.sh >> $GITHUB_ENV

    - name: '[Setup] Android Keystore'
      if: ${{ matrix.platform == 'android' }}
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.ORG_LINN_KEYSTORE }}
        RELEASE_KEYSTORE: ${{ vars.CARGO_APK_RELEASE_KEYSTORE }}
      run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -di > "$RELEASE_KEYSTORE"

    - name: '[Build] Compile Binary'
      if: ${{ matrix.platform == 'desktop' }}
      run: cargo build --verbose --release --package=ln_drawer --bin=ln_drawer --target ${{ matrix.target }}

    - name: '[Build] Compile Library and Package (Apk)'
      if: ${{ matrix.platform == 'android' }}
      env:
        RELEASE_KEYSTORE: ${{ vars.CARGO_APK_RELEASE_KEYSTORE }}
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.CARGO_APK_RELEASE_KEYSTORE_PASSWORD }}
      working-directory: ./ln_drawer/build/android
      run: |
        export JAVA_HOME="$JAVA_HOME_21_X64"
        export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"

        ./gradlew assembleRelease -PcargoProfile=release
        "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
          --ks "$RELEASE_KEYSTORE" \
          --ks-pass "env:RELEASE_KEYSTORE_PASSWORD" \
          --out "$RUNNER_TEMP/ln_drawer.apk" \
          app/build/outputs/apk/release/app-release-unsigned.apk
        echo "ARTIFACT=$(readlink -f "$RUNNER_TEMP/ln_drawer.apk")" >> $GITHUB_ENV

    - name: '[Build] Package for Windows (Zip)'
      if: ${{ matrix.package == 'windows-zip' }}
      working-directory: target/${{ matrix.target }}/release/
      run: | 
        zip -v ln_drawer.zip ln_drawer.exe
        echo "ARTIFACT=$(readlink -f ln_drawer.zip)" > $GITHUB_ENV

    - name: '[Build] Package for Linux (Tar + Gzip)'
      if: ${{ matrix.package == 'linux-tar' }}
      working-directory: target/${{ matrix.target }}/release/
      run: |
        tar -czvf ln_drawer.tar.gz ln_drawer
        echo "ARTIFACT=$(readlink -f ln_drawer.tar.gz)" > $GITHUB_ENV

    - name: '[Build] Package for Linux (AppImage)'
      if: ${{ matrix.package == 'linux-tar' }}
      env:
        APPIMAGETOOL: ${{ runner.temp }}/appimagetool
        BIN: target/${{ matrix.target }}/release/ln_drawer
      run: |
        ln_drawer/build/appimage/build.sh
        echo "APPIMAGE=$(readlink -f target/appimage/ln_drawer.AppImage)" >> $GITHUB_ENV

    - name: '[Actions] Upload Artifacts'
      uses: actions/upload-artifact@v7
      with:
        name: artifact-${{ matrix.target }}-${{ matrix.package }}
        path: ${{ env.ARTIFACT }}

    - name: '[Actions] Upload AppImage Artifact'
      if: ${{ matrix.package == 'linux-tar' }}
      uses: actions/upload-artifact@v7
      with:
        name: artifact-${{ matrix.target }}-linux-appimage
        path: ${{ env.APPIMAGE }}
  
  release:
    name: Release
    needs: [build]
    if: ${{ inputs.draft }}
    runs-on: ubuntu-latest

    steps:
    - name: '[Actions] Checkout'
      uses: actions/checkout@v7

    - name: '[Actions] Download Artifacts'
      uses: actions/download-artifact@v8

    - name: '[Release] Github Actions Bot'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: '[Release] Draft Release'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        VER: ${{ inputs.version }}
        SHA: ${{ github.sha }}
      run: |
        set -e

        PAYLOAD=$(jq -n \
          --arg tag "v$VER" \
          --arg name "LnDrawer v$VER" \
          --arg body "This release is auto-generated." \
          --arg commit "$SHA" \
          '{tag_name: $tag, target_commitish: $commit, name: $name, body: $body, draft: true, prerelease: false}')

        RESPONSE=$(curl -s -X POST \
          -H "Authorization: token $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$REPO/releases" \
          -d "$PAYLOAD")

        RELEASE_ID=$(echo "$RESPONSE" | jq '.id')

        if [ "$RELEASE_ID" = "null" ] || [ -z "$RELEASE_ID" ]; then
          echo "Failed to obtain Release ID"
          exit 1
        fi

        echo "Release ID: $RELEASE_ID"
        echo "RELEASE_ID=$RELEASE_ID" >> $GITHUB_ENV

    - name: '[Release] Upload Assets'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        ASSETS: |
          artifact-x86_64-unknown-linux-gnu-linux-tar/ln_drawer.tar.gz|ln_drawer-v${{ inputs.version }}-linux-x86_64.tar.gz
          artifact-x86_64-unknown-linux-gnu-linux-appimage/ln_drawer.AppImage|ln_drawer-v${{ inputs.version }}-linux-x86_64.AppImage
          artifact-x86_64-pc-windows-gnu-windows-zip/ln_drawer.zip|ln_drawer-v${{ inputs.version }}-windows-x86_64.zip
          artifact-aarch64-linux-android-android-apk/ln_drawer.apk|ln_drawer-v${{ inputs.version }}-android-aarch64.apk
      run: |
        set -e

        while IFS= read -r entry; do
          [ -z "$entry" ] && continue

          file=${entry%|*}
          name=${entry##*|}

          if [ ! -f "$file" ]; then
            echo "Missing artifact: $file"
            exit 1
          fi
          
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$file" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$name"

          echo ""
          echo "Upload '$file' as '$name'"
        done <<< "$ASSETS"