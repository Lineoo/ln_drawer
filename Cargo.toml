[workspace]
members = ["ln_drawer", "ln_world"]
resolver = "3"

[workspace.package]
edition = "2024"

[patch.crates-io.winit]
git = "https://github.com/SergioRibera/winit"
branch = "layer_shell"

[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
