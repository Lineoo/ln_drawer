name: Test

on:
  push:
    branches:
      - dev
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Actions Checkout
      uses: actions/checkout@v6

    - name: Actions Cache
      uses: actions/cache@v5
      with:
        key: ubuntu-all-cross-test-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ubuntu-all-cross-test-
          ubuntu-all-cross-
        path: |
          ~/.cargo
          target

    - name: Install ALSA Library
      run: sudo apt-get install libasound2-dev

    - name: Cargo Fmt
      run: cargo fmt --all --check

    - name: Cargo Test x86_64 Linux
      run: cargo test
