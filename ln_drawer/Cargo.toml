[package]
name = "ln_drawer"
license = "LGPL-3.0-or-later"
version = "0.2.0-dev"
edition.workspace = true

[lib]
name = "ln_drawer"
crate-type = ["lib", "cdylib"]

[dependencies]
bytemuck = "1.23.2"
cosmic-text = { version = "0.19.0", features = ["shape-run-cache"] }
dirs = "6.0.0"
env_logger = "0.11.8"
glam = { version = "0.33.2", features = ["bytemuck", "serde"] }
hashbrown = { version = "0.17.1", features = ["serde"] }
image = "0.25.6"
indexmap = "2.11.0"
log = "0.4.27"
memmap2 = "0.9.10"
palette = "0.7.6"
parking_lot = "0.12.4"
pollster = "0.4.0"
postcard = { version = "1.1.3", features = ["use-std"] }
redb = "4.1.0"
rodio = { version = "0.21.1", features = ["noise"] }
serde = "1.0.228"
serde_bytes = "0.11.19"
smallvec = "1.15.1"
swash = "0.2.9"
thiserror = "2.0.16"
tokio = "1.47.1"
usvg = "0.47.0"
wgpu = "30.0"
zeno = "0.3.3"
zstd = "0.13.3"

[dependencies.ln_world]
path = "../ln_world"

[dependencies.winit]
version = "0.31.0-beta.2"
features = ["android-native-activity"]

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"

[package.metadata.android]
package = "dev.linn.lndrawer"
resources = "android"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
icon = "@mipmap/icon_dev"
label = "LnDrawer Dev"
