[workspace]
members = ["ln_drawer", "ln_world"]
resolver = "3"

[workspace.package]
edition = "2024"

[patch.crates-io.winit]
git = "https://github.com/Lineoo/winit/"
branch = "ln_drawer"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package.ln_drawer]
opt-level = 1

[profile.dev.package.ln_world]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
