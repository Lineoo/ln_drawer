name: Release
run-name: Release ${{ inputs.version }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (include "v" prefix, for example "v1.2.6-beta.3")
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.platform }} ${{ matrix.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64 Linux
            platform: desktop
            target: x86_64-unknown-linux-gnu
            artifact: target/x86_64-unknown-linux-gnu/release/ln_drawer.tar.gz

          - name: x86_64 Windows
            platform: desktop
            target: x86_64-pc-windows-gnu
            artifact: target/x86_64-pc-windows-gnu/release/ln_drawer.zip

          - name: Aarch64 Android
            platform: android
            target: aarch64-linux-android
            artifact: target/release/apk/ln_drawer.apk

    steps:
    - name: '[Actions] Checkout'
      uses: actions/checkout@v7

    - name: '[Actions] Cache'
      uses: actions/cache@v6
      with:
        key: ubuntu-build-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ubuntu-build-${{ matrix.target }}-
          ubuntu-build-
          ubuntu-
        path: |
          ~/.cargo
          target

    - name: '[Install] ALSA Library'
      run: sudo apt-get install libasound2-dev

    - name: '[Install] MinGW-w64 for Win32 & Posix'
      if: ${{ matrix.target == 'x86_64-pc-windows-gnu' }}
      run: sudo apt-get install gcc-mingw-w64-x86-64-win32 gcc-mingw-w64-x86-64-posix

    - name: '[Install] Rustup Target ${{ matrix.target }}'
      run: rustup target add ${{ matrix.target }}

    - name: '[Install] Cargo Apk'
      if: ${{ matrix.platform == 'android' }}
      run: cargo install cargo-apk

    - name: '[Setup] Release Configuration'
      run: ln_drawer/build/release.sh

    - name: '[Setup] Android Keystore'
      if: ${{ matrix.platform == 'android' }}
      env:
        ORG_LINN_KEYSTORE: ${{ secrets.ORG_LINN_KEYSTORE }}
        CARGO_APK_RELEASE_KEYSTORE: ${{ vars.CARGO_APK_RELEASE_KEYSTORE }}
      run: echo "$ORG_LINN_KEYSTORE" | base64 -di > "$CARGO_APK_RELEASE_KEYSTORE"

    - name: '[Build] Compile Binary'
      if: ${{ matrix.platform == 'desktop' }}
      env:
        LN_SAVE_FILE_LOCATION: LnDrawer
      run: cargo build --verbose --release --package=ln_drawer --bin=ln_drawer --target ${{ matrix.target }}

    - name: '[Build] Compile Library and Package (Apk)'
      if: ${{ matrix.platform == 'android' }}
      env:
        CARGO_APK_RELEASE_KEYSTORE: ${{ vars.CARGO_APK_RELEASE_KEYSTORE }}
        CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.CARGO_APK_RELEASE_KEYSTORE_PASSWORD }}
      run: cargo apk build --verbose --release --package=ln_drawer --lib --target ${{ matrix.target }}

    - name: '[Build] Package for Windows (Zip)'
      if: ${{ matrix.target == 'x86_64-pc-windows-gnu' }}
      working-directory: target/${{ matrix.target }}/release/
      run: zip -v ln_drawer.zip ln_drawer.exe

    - name: '[Build] Package for Linux (Tar + Gzip)'
      if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
      working-directory: target/${{ matrix.target }}/release/
      run: tar -czvf ln_drawer.tar.gz ln_drawer

    - name: '[Actions] Upload Artifacts'
      uses: actions/upload-artifact@v7
      with:
        name: ln_drawer-${{ matrix.target }}
        path: ${{ matrix.artifact }}
  
  release:
    name: Release
    needs: [build]
    runs-on: ubuntu-latest

    steps:
    - name: '[Actions] Checkout'
      uses: actions/checkout@v7

    - name: '[Actions] Download Artifacts'
      uses: actions/download-artifact@v8

    - name: '[Release] Github Actions Bot'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: '[Release] Draft Release'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        VER: ${{ inputs.version }}
        SHA: ${{ github.sha }}
      run: |
        set -e

        PAYLOAD=$(jq -n \
          --arg tag "$VER" \
          --arg name "LnDrawer $VER" \
          --arg body "This release is auto-generated." \
          --arg commit "$SHA" \
          '{tag_name: $tag, target_commitish: $commit, name: $name, body: $body, draft: true, prerelease: false}')

        RESPONSE=$(curl -s -X POST \
          -H "Authorization: token $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$REPO/releases" \
          -d "$PAYLOAD")

        RELEASE_ID=$(echo "$RESPONSE" | jq '.id')

        if [ "$RELEASE_ID" = "null" ] || [ -z "$RELEASE_ID" ]; then
          echo "Failed to obtain Release ID"
          exit 1
        fi

        echo "Release ID: $RELEASE_ID"
        echo "RELEASE_ID=$RELEASE_ID" >> $GITHUB_ENV

    - name: '[Release] Upload Assets'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        ASSETS: >
          target/x86_64-unknown-linux-gnu/release/ln_drawer.tar.gz|ln_drawer-${{ inputs.version }}-linux-x86_64.tar.gz
          target/x86_64-pc-windows-gnu/release/ln_drawer.zip|ln_drawer-${{ inputs.version }}-windows-x86_64.zip
          target/release/apk/ln_drawer.apk|ln_drawer-${{ inputs.version }}-android-aarch64.apk
      run: |
        set -e

        for entry in $ASSETS; do
          file="$(echo "$entry" | cut -d'|' -f1)"
          name="$(echo "$entry" | cut -d'|' -f2)"

          [ -f "$file" ] || continue
          
          echo "Uploading '$file' as '$name'"
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$file" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$name"
        done