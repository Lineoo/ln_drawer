[workspace]
members = ["ln_drawer", "ln_world"]
resolver = "3"

[workspace.package]
edition = "2024"

[patch.crates-io.winit]
git = "https://github.com/Lineoo/winit/"
branch = "ln_drawer"

[patch.crates-io.wgpu]
git = "https://github.com/Lineoo/wgpu/"
branch = "fence-fix"

[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
