[package]
name = "ln_drawer"
license = "AGPL-3.0-or-later"
version = "0.5.0-dev"
edition.workspace = true

[lib]
name = "ln_drawer"
crate-type = ["lib", "cdylib"]

[dependencies]
bytemuck = "1.23.2"
cosmic-text = { version = "0.19.0", features = ["shape-run-cache"] }
dirs = "6.0.0"
env_logger = "0.11.8"
glam = { version = "0.33.2", features = ["bytemuck", "serde"] }
guillotiere = "0.7.0"
hashbrown = { version = "0.17.1", features = ["serde"] }
icu_locale = "2.3.1"
indexmap = "2.11.0"
log = "0.4.27"
lyon = "1.0.19"
png = "0.18.1"
pollster = "0.4.0"
postcard = { version = "1.1.3", features = ["use-std"] }
redb = { version = "4.1.0", features = ["logging"] }
serde = "1.0.228"
serde_json = "1.0.154"
smallvec = "1.15.1"
swash = "0.2.9"
sys-locale = "0.3.2"
thiserror = "2.0.16"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std"] }
toml_edit = { version = "0.25.15", features = ["serde"] }
usvg = "0.47.0"
uuid = { version = "1.28.0", features = ["v7"] }
wgpu = "30.0"
zeno = "0.3.3"
zstd = "0.13.3"

[dependencies.ln_world]
path = "../ln_world"

[dependencies.winit]
version = "0.31.0-beta.2"
features = ["android-native-activity"]

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
jni = "0.22"
