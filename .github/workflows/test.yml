name: Test

on:
  push:
    branches:
      - master
      - releases/**

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - uses: actions/cache@v5
      with:
        key: ubuntu-all-cross-test-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ubuntu-all-cross-test-
        path: |
          ~/.cargo
          target

    - name: Install ALSA Library
      run: sudo apt-get install libasound2-dev

    - name: Install MinGW-w64 for Win32 & Posix
      run: sudo apt-get install gcc-mingw-w64-x86-64-win32 gcc-mingw-w64-x86-64-posix

    - name: Install Rustup Target x86_64-pc-windows-gnu
      run: rustup target add x86_64-pc-windows-gnu

    - name: Install Rustup Target aarch64-linux-android
      run: rustup target add aarch64-linux-android

    - name: Install Rustup Target armv7-linux-androideabi
      run: rustup target add armv7-linux-androideabi

    - name: Cargo Fmt
      run: cargo fmt --all --check

    - name: Cargo Test x86_64 Linux
      run: cargo test --target x86_64-unknown-linux-gnu
    
    - name: Cargo Test x86_64 Windows
      run: cargo test --target x86_64-pc-windows-gnu

    - name: Cargo Test aarch64 Android
      run: cargo test --target aarch64-linux-android
